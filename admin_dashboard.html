<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARAMS — Atelier Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'serif'],
          },
          colors: {
            brand: {
              black: '#12100E',
              gray: '#F4F4F4',
              accent: '#C5A880', // muted gold
              border: '#E5E5E5'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FAFAFA; color: #12100E; }
    .glass-card { background: white; border: 1px solid #E5E5E5; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); transition: transform 0.2s; }
    .glass-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
    .sidebar-link { transition: all 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: #1A1816; color: white; }
    .sidebar-link.active { border-left: 3px solid #C5A880; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E5E5E5; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #CCCCCC; }
  </style>
</head>
<body class="flex h-screen overflow-hidden antialiased selection:bg-brand-accent selection:text-white">

  <!-- Sidebar -->
  <aside class="w-64 bg-brand-black text-gray-300 flex flex-col justify-between hidden md:flex border-r border-[#2A2826]">
    <div>
      <div class="h-20 flex items-center px-8 border-b border-[#2A2826]">
        <h1 class="font-serif text-2xl text-white tracking-widest uppercase">ARAMS<span class="text-brand-accent">.</span></h1>
      </div>
      <nav class="mt-8 flex flex-col gap-2 px-4 text-sm font-medium tracking-wide">
        <p class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">Management</p>
        <a href="/admin/dashboard" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          Dashboard
        </a>
        <a href="/admin/orders" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
          Orders
        </a>
        <a href="/admin/products" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
          Catalog
        </a>
        <a href="/admin/coupons" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
          Promotions
        </a>
      </nav>
    </div>
    <div class="p-4 mb-4">
      <a href="/admin/settings" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium mb-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Settings
      </a>
      <a href="/admin/logout" class="flex items-center justify-center gap-2 w-full py-3 bg-[#2A2826] hover:bg-[#33302E] text-white rounded-lg transition text-xs tracking-widest uppercase font-semibold">
        Log Out
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="h-20 bg-white/80 backdrop-blur-md border-b border-brand-border flex items-center justify-between px-8 z-10 sticky top-0">
      <div>
        <h2 class="text-xl font-serif font-semibold text-brand-black">Atelier Overview</h2>
        <p class="text-xs text-gray-500 tracking-wide">Real-time performance metrics</p>
      </div>
      <div class="flex items-center gap-4">
        <button id="refresh-dashboard" class="flex items-center gap-2 px-4 py-2 bg-brand-black text-white text-sm font-medium rounded-full hover:bg-black transition shadow-lg shadow-black/10">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Sync Data
        </button>
      </div>
    </header>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto p-8">
      <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="kpi-grid">
          <!-- Populated via JS -->
          <div class="glass-card p-6 animate-pulse bg-gray-100 h-32"></div>
          <div class="glass-card p-6 animate-pulse bg-gray-100 h-32"></div>
          <div class="glass-card p-6 animate-pulse bg-gray-100 h-32"></div>
          <div class="glass-card p-6 animate-pulse bg-gray-100 h-32"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- Chart Section -->
          <div class="lg:col-span-2 glass-card p-6 flex flex-col">
            <div class="flex justify-between items-center mb-6">
              <h3 class="font-serif text-lg font-semibold">Order Fulfillment Status</h3>
            </div>
            <div class="flex-1 relative min-h-[250px]">
              <canvas id="statusChart"></canvas>
            </div>
          </div>

          <!-- Top Products -->
          <div class="glass-card p-6">
            <h3 class="font-serif text-lg font-semibold mb-6">Best Performing Pieces</h3>
            <div id="top-products" class="space-y-4">
              <div class="animate-pulse bg-gray-100 h-10 rounded"></div>
              <div class="animate-pulse bg-gray-100 h-10 rounded"></div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
           <!-- Inventory Alerts -->
           <div class="glass-card p-6">
            <h3 class="font-serif text-lg font-semibold mb-6 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
              Inventory Alerts
            </h3>
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-500 uppercase tracking-wider border-b border-gray-200">
                  <tr>
                    <th class="pb-3 font-semibold">Product Piece</th>
                    <th class="pb-3 font-semibold text-right">Stock</th>
                  </tr>
                </thead>
                <tbody id="low-stock" class="divide-y divide-gray-100">
                </tbody>
              </table>
            </div>
          </div>

          <!-- Active Promotions -->
          <div class="glass-card p-6">
            <h3 class="font-serif text-lg font-semibold mb-6">Active Promotions</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-500 uppercase tracking-wider border-b border-gray-200">
                  <tr>
                    <th class="pb-3 font-semibold">Code</th>
                    <th class="pb-3 font-semibold">Value</th>
                    <th class="pb-3 font-semibold text-right">Uses</th>
                  </tr>
                </thead>
                <tbody id="top-coupons" class="divide-y divide-gray-100">
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const formatCurrency = (amount) => new Intl.NumberFormat('en-BD', { style: 'currency', currency: 'BDT', maximumFractionDigits: 0 }).format(amount);
    const formatNumber = (num) => new Intl.NumberFormat('en-US').format(num);

    let statusChartInstance = null;

    async function loadData() {
      try {
        const btn = document.getElementById('refresh-dashboard');
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        
        const res = await fetch('/api/admin/analytics');
        if (res.status === 401) { window.location.href = '/admin/login'; return; }
        const data = await res.json();
        const m = data.metrics;

        // KPI Cards
        document.getElementById('kpi-grid').innerHTML = `
          <div class="glass-card p-6 relative overflow-hidden group">
            <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:scale-110 transition duration-500">
              <svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/></svg>
            </div>
            <p class="text-sm font-semibold text-gray-500 uppercase tracking-widest mb-1">Total Revenue</p>
            <h3 class="text-3xl font-serif font-bold text-brand-black">${formatCurrency(m.total_revenue)}</h3>
            <p class="text-xs text-green-600 mt-2 flex items-center gap-1 font-medium">From ${formatNumber(m.valid_orders)} verified orders</p>
          </div>
          <div class="glass-card p-6">
            <p class="text-sm font-semibold text-gray-500 uppercase tracking-widest mb-1">Total Orders</p>
            <h3 class="text-3xl font-serif font-bold text-brand-black">${formatNumber(m.total_orders)}</h3>
            <p class="text-xs text-gray-500 mt-2 font-medium">Includes cancelled orders</p>
          </div>
          <div class="glass-card p-6">
            <p class="text-sm font-semibold text-gray-500 uppercase tracking-widest mb-1">Avg. Order Value</p>
            <h3 class="text-3xl font-serif font-bold text-brand-black">${formatCurrency(m.average_order_value)}</h3>
            <p class="text-xs text-gray-500 mt-2 font-medium">Per valid transaction</p>
          </div>
          <div class="glass-card p-6">
            <p class="text-sm font-semibold text-gray-500 uppercase tracking-widest mb-1">Total Discounts</p>
            <h3 class="text-3xl font-serif font-bold text-brand-black">${formatCurrency(m.total_discounts_granted)}</h3>
            <p class="text-xs text-brand-accent mt-2 font-medium">Value given to clients</p>
          </div>
        `;

        // Chart
        const ctx = document.getElementById('statusChart').getContext('2d');
        const labels = Object.keys(data.status_breakdown);
        const values = Object.values(data.status_breakdown);
        
        if (statusChartInstance) statusChartInstance.destroy();
        statusChartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.map(l => l.charAt(0).toUpperCase() + l.slice(1)),
            datasets: [{
              data: values,
              backgroundColor: ['#12100E', '#C5A880', '#F3F4F6', '#E5E7EB', '#9CA3AF'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            cutout: '75%',
            plugins: {
              legend: { position: 'right', labels: { font: { family: "'DM Sans', sans-serif" }, usePointStyle: true, padding: 20 } }
            }
          }
        });

        // Top Products
        const tp = document.getElementById('top-products');
        if(data.top_products.length){
          tp.innerHTML = data.top_products.map((p, i) => `
            <div class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg transition">
              <div class="flex items-center gap-4">
                <div class="w-8 h-8 rounded bg-gray-100 flex items-center justify-center font-serif text-sm font-bold text-gray-500">${i+1}</div>
                <div>
                  <p class="font-semibold text-sm">${p.name}</p>
                  <p class="text-xs text-gray-500">${p.id}</p>
                </div>
              </div>
              <div class="text-right">
                <p class="font-bold text-sm text-brand-black">${formatCurrency(p.revenue)}</p>
                <p class="text-xs text-gray-500">${p.quantity} units</p>
              </div>
            </div>
          `).join('');
        } else { tp.innerHTML = '<p class="text-sm text-gray-500 italic">No pieces sold yet.</p>'; }

        // Low Stock
        const ls = document.getElementById('low-stock');
        if(data.low_stock_products.length){
          ls.innerHTML = data.low_stock_products.map(p => `
            <tr class="hover:bg-gray-50 transition">
              <td class="py-3 font-medium text-sm">${p.name}</td>
              <td class="py-3 text-right">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700">
                  ${p.stock} left
                </span>
              </td>
            </tr>
          `).join('');
        } else { ls.innerHTML = '<tr><td colspan="2" class="py-4 text-center text-sm text-gray-500 italic">Inventory levels are healthy.</td></tr>'; }

        // Coupons
        const tc = document.getElementById('top-coupons');
        if(data.coupons.length){
          tc.innerHTML = data.coupons.slice(0,5).map(c => `
            <tr class="hover:bg-gray-50 transition ${!c.active ? 'opacity-50' : ''}">
              <td class="py-3 font-bold text-sm uppercase tracking-wider">${c.code}</td>
              <td class="py-3 text-sm">${c.type === 'percent' ? c.value + '%' : formatCurrency(c.value)}</td>
              <td class="py-3 text-right font-medium text-sm">${c.used_count}</td>
            </tr>
          `).join('');
        } else { tc.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-sm text-gray-500 italic">No active promotions.</td></tr>'; }

        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      } catch (e) { console.error(e); }
    }

    document.getElementById('refresh-dashboard').addEventListener('click', loadData);
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
