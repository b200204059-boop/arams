<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARAMS Admin Portal</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --paper: #ffffff;
      --soft: #f8fafc;
      --soft-strong: #f1f5f9;
      --brand: #4f46e5;
      --brand-dark: #3730a3;
      --brand-soft: #e0e7ff;
      --success: #dcfce7;
      --success-text: #166534;
      --warn: #fef08a;
      --warn-text: #854d0e;
      --danger: #fee2e2;
      --danger-text: #991b1b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --sidebar-bg: #1e293b;
      --sidebar-ink: #f8fafc;
      --sidebar-muted: #94a3b8;
      --sidebar-hover: #334155;
      --sidebar-active: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: var(--ink);
    }
    .wrap {
      max-width: 1220px;
      margin: 0 auto;
      padding: 32px 18px 80px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
      padding: 18px 20px;
      background: rgba(255,255,255,0.66);
      border: 1px solid rgba(23,20,18,0.06);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 38px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }
    .badge {
      display: inline-block;
      padding: 9px 13px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: white;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 999px;
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.3);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    .admin-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 0 0 18px;
    }
    .filter-box input, .filter-box select {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.8);
      padding: 0 12px;
      font-size: 13px;
      color: var(--ink);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 0 0 24px;
    }
    .summary-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 20px 16px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--brand) 0%, rgba(79, 70, 229, 0.2) 100%);
    }
    .summary-card .label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .summary-card strong {
      display: block;
      font-size: clamp(24px, 2vw, 32px);
      line-height: 1.1;
      margin-bottom: 6px;
      letter-spacing: -0.04em;
    }
    .summary-card small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      display: block;
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button, .button-link {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    button:hover, .button-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(20, 18, 17, 0.06);
      border-color: rgba(20, 18, 17, 0.12);
    }
    .button-primary {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      border-color: transparent;
      color: white;
      box-shadow: 0 12px 22px rgba(79, 70, 229, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      margin: 0 0 16px;
      font-size: 22px;
      letter-spacing: -0.03em;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
    }
    textarea {
      min-height: 86px;
      resize: vertical;
    }
    .half {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .product-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    .product-list li {
      border: 1px solid rgba(23,20,18,0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      background: linear-gradient(180deg, rgba(246,241,235,0.7) 0%, rgba(255,255,255,0.9) 100%);
    }
    .product-meta {
      font-size: 14px;
      line-height: 1.5;
    }
    .product-meta strong {
      font-size: 15px;
    }
    .product-meta small {
      color: var(--muted);
    }
    .product-price {
      font-weight: 800;
      white-space: nowrap;
      color: var(--brand-dark);
    }
    .product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .mini-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .mini-button.danger {
      border-color: rgba(166, 63, 63, 0.2);
      background: #fff3f3;
      color: var(--danger-text);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      background: var(--soft);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    tbody tr:hover {
      background: rgba(79, 70, 229, 0.04);
    }
    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--soft-strong);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .status--awaiting_whatsapp { background: #ffedd5; color: #c2410c; }
    .status--awaiting_payment { background: #fef9c3; color: #a16207; }
    .status--paid { background: #dcfce7; color: #15803d; }
    .status--packed { background: #dbeafe; color: #1d4ed8; }
    .status--shipped { background: #e0e7ff; color: #4338ca; }
    .status--completed { background: #bbf7d0; color: #166534; }
    .status--cancelled { background: var(--danger); color: var(--danger-text); }
    .status-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      background: #fff;
      color: var(--ink);
    }
    .toast {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .toast.show {
      display: block;
    }
    .toast.success {
      background: var(--success);
      color: var(--success-text);
    }
    .toast.error {
      background: var(--danger);
      color: var(--danger-text);
    }
    .empty {
      padding: 22px 0;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border-bottom: 1px solid var(--line); }
      td { border: none; padding: 10px 16px; }
      .half { grid-template-columns: 1fr; }
    .top-navbar {
      display: flex; align-items: center; background: var(--sidebar-bg); color: var(--sidebar-ink);
      padding: 0 32px; height: 64px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .top-navbar .brand { font-size: 20px; font-weight: 800; margin-right: 48px; letter-spacing: 0.05em; color: white; display:flex; align-items:center; }
    .top-navbar-nav { display: flex; gap: 8px; flex: 1; }
    .top-navbar-nav a {
      text-decoration: none; color: var(--sidebar-muted); font-weight: 600;
      padding: 8px 16px; border-radius: 8px; transition: all 0.2s;
    }
    .top-navbar-nav a:hover { background: var(--sidebar-hover); color: var(--sidebar-ink); }
    .top-navbar-nav a.active { background: rgba(56, 189, 248, 0.15); color: var(--sidebar-active); }
    .top-navbar-actions { display: flex; align-items: center; gap: 16px; }
    .page-container { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  </style>
</head>
<body>
    <nav class="top-navbar">
    <div class="brand">ARAMS <span class="badge" style="margin-left: 8px;">Admin</span></div>
    <div class="top-navbar-nav">
      <a href="/admin/orders">Orders</a>
      <a href="/admin/products">Products</a>
      <a href="/admin/coupons">Coupons</a>
      <a href="/admin/settings" class="active">Settings</a>
    </div>
    <div class="top-navbar-actions">
      <a class="button-link" href="/admin/logout" style="background: rgba(255,255,255,0.1); border:none; color:white;">Logout</a>
    </div>
  </nav>
  <main class="page-container">
      <div class="top-header">
        <h2 style="margin: 0; font-size: 28px;">Settings</h2>
        <div class="admin-actions">
          <div class="button-row">
            <button type="button" id="refresh-orders">Refresh orders</button>
            <button type="button" id="export-orders">Export CSV</button>
          </div>
        </div>
      </div>

    
    <div class="card">
        <h2>General Settings</h2>
        <p>Settings management coming soon.</p>
    </div>
    </main>
  </div>
</body>
</html>
