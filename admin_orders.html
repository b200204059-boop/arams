<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARAMS Orders</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #666;
      --line: #e6e6e6;
      --paper: #fff;
      --soft: #f5f5f0;
      --red: #b83e32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--soft);
      color: var(--ink);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
    }
    .badge {
      display: inline-block;
      padding: 8px 12px;
      background: var(--red);
      color: white;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      background: #f8f8f8;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3e7d9;
      color: #7a4c26;
      font-size: 11px;
      font-weight: 700;
    }
    .empty {
      padding: 24px 16px;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 760px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border-bottom: 1px solid var(--line); }
      td { border: none; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>ARAMS Orders</h1>
      <span class="badge">Admin</span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
      <div id="empty-state" class="empty" hidden>No orders yet.</div>
    </div>
  </div>

  <script>
    async function loadOrders() {
      const tableBody = document.getElementById('orders-body');
      const emptyState = document.getElementById('empty-state');
      try {
        const response = await fetch('/api/orders');
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Could not load orders');

        const orders = payload.orders || [];
        if (!orders.length) {
          tableBody.innerHTML = '';
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;
        tableBody.innerHTML = orders.map((order) => {
          const items = (order.items || []).map((item) => `${item.name || item.id} x ${item.quantity || 0}`).join(', ');
          return `
            <tr>
              <td>${order.reference}</td>
              <td>${order.customer_name}<br><small>${order.customer_email || 'No email'}</small></td>
              <td>${order.customer_phone}</td>
              <td>${items || '—'}</td>
              <td>৳${Number(order.total || 0).toLocaleString('en-BD')}</td>
              <td><span class="status">${order.status}</span></td>
              <td>${new Date(order.created_at).toLocaleString()}</td>
            </tr>
          `;
        }).join('');
      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="7">${error.message}</td></tr>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
