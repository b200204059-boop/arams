<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARAMS Portal Login</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #5d5d5d;
      --paper: #fff;
      --soft: #f4f0ea;
      --line: #e7e1d7;
      --brand: #a74635;
      --brand-dark: #7d3228;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f7f1ea 0%, #efe4d5 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }
    .login-box {
      width: min(92vw, 460px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 55px rgba(33, 25, 20, 0.08);
      padding: 30px 28px;
    }
    .brand {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.5rem);
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--brand);
      color: white;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: var(--brand-dark);
    }
    .helper {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    code {
      background: #f7f1ea;
      border-radius: 8px;
      padding: 2px 6px;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">ARAMS Portal</div>
    <h1>Admin login</h1>
    <p class="subtitle">Use your admin account to manage orders and add products to the store.</p>

    <form method="post" action="/admin/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="admin" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter password" required>

      <button type="submit">Log in</button>
    </form>

    <div class="helper">
      Default admin credentials: <code>admin</code> / <code>admin123</code><br>
      You can override these with the environment variables <code>ARAMS_ADMIN_USERNAME</code> and <code>ARAMS_ADMIN_PASSWORD</code>.
    </div>
  </div>
</body>
</html>
